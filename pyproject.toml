[project]
# Renamed from "database-cache" so the distribution name matches the import name
# and the repo. Change it back if "dbcache" turns out to be taken on PyPI.
name = "dbcache"
version = "0.1.0"
description = "SQLite-backed function cache decorator"
readme = "README.md"
# 3.12 is a hard floor, not a preference. Connection.setconfig and the
# SQLITE_DBCONFIG_DQS_* constants arrived in 3.12, and turning double-quoted
# string literals off is what stops a missing column being read as its own name
# instead of raising. quote() also nests same-quote f-strings (PEP 701), which
# earlier versions cannot parse at all.
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]

# TODO: add authors, license and [project.urls] before publishing -- left out
# rather than guessed at.

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Flat layout, declared explicitly rather than left to auto-discovery -- guessing
# wrong is what silently dropped __init__.py from the wheel before.
[tool.setuptools.packages.find]
where = ["."]
include = ["dbcache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
